name: Release GitHub

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    # The wait below is 5.5 hours; this leaves the job room to report and create the release.
    timeout-minutes: 340
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out release target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.sha }}
      - name: Check out current release controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: .release-control
          sparse-checkout: scripts/release-languages.sh
      - name: Select versioned release languages
        id: activation
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          trap 'rm -rf .release-control' EXIT
          languages=$(.release-control/scripts/release-languages.sh "$GITHUB_WORKSPACE" "$EVENT_NAME")
          echo "languages=$languages" >> "$GITHUB_OUTPUT"
      # Publishes wait for a reviewer from sip or cli (release-crates today, and every
      # release-* environment once a workflow uses it), so the wait is measured in hours,
      # not the shared action's thirty minutes. Its loop costs one or two requests per
      # language per poll, which over hours outruns GITHUB_TOKEN's 1,000 requests an hour,
      # so this step does the waiting with one request per poll for every run on the
      # tagged commit, and the shared action below then takes a single pass to report and
      # create the release.
      - name: Wait for release workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          LANGUAGES: ${{ steps.activation.outputs.languages }}
        run: |
          sha=$(git rev-parse HEAD)
          max_wait=19800  # 5.5 hours
          poll=30
          # Bash's SECONDS counts the requests and jq between sleeps too, so the wait ends
          # on time and the job's 340 minutes leave room for the report below.
          SECONDS=0
          IFS=',' read -ra langs <<< "$LANGUAGES"

          while :; do
            pending=()
            failed=false
            # A transient API error shouldn't end a wait measured in hours.
            if runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&event=push&per_page=100" \
                --jq '.workflow_runs'); then
              for lang in "${langs[@]}"; do
                # Newest push run of this workflow for the tag. A run's path can carry an
                # @ref suffix, so match the file without it.
                conclusion=$(jq -r --arg path ".github/workflows/release-$lang.yml" --arg tag "$TAG" \
                  '[.[] | select((.path | sub("@.*$"; "")) == $path and .head_branch == $tag)]
                   | if length == 0 then "none" else (.[0].conclusion // "running") end' <<< "$runs")
                case "$conclusion" in
                  success) ;;
                  none | running) pending+=("$lang ($conclusion)") ;;
                  *) failed=true; echo "  $lang: $conclusion" ;;
                esac
              done
            else
              echo "::warning::Listing workflow runs failed; retrying next poll"
              pending=("(unknown)")
            fi

            # A failure is reported by the shared action below, with how to recover.
            if $failed || [ "${#pending[@]}" -eq 0 ]; then
              break
            fi
            if [ "$SECONDS" -ge "$max_wait" ]; then
              echo "::warning::Stopped waiting after ${max_wait}s for: ${pending[*]}"
              break
            fi
            echo "  Waiting for: ${pending[*]} (${SECONDS}s elapsed)"
            sleep "$poll"
          done
      - uses: basecamp/sdk/actions/release-orchestrate@main # zizmor: ignore[unpinned-uses] -- internal action tracking main by design (basecamp/sdk AGENTS.md); basecamp/sdk has no tags for Dependabot to advance a pin
        with:
          version: ${{ github.event.inputs.tag || github.ref_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # The tagged commit provides the same immutable activation decision to
          # release-typescript.yml and this orchestrator. Historical manual targets
          # select the release workflows that existed in that target.
          languages: ${{ steps.activation.outputs.languages }}
          # The step above has already waited: one pass reports what it sees and, when
          # every workflow succeeded, creates the release.
          timeout: '1'
          poll-interval: '1'
