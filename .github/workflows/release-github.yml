name: Release GitHub

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.sha }}
      - name: Read versioned publication state
        id: activation
        run: echo "enabled=$(bash scripts/typescript-publish-state.sh)" >> "$GITHUB_OUTPUT"
      - uses: basecamp/sdk/actions/release-orchestrate@main # zizmor: ignore[unpinned-uses] -- internal composite action tracking main; subpath actions cannot be SHA-pinned
        with:
          version: ${{ github.event.inputs.tag || github.ref_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # The tagged commit provides the same immutable activation decision to
          # release-typescript.yml and this orchestrator.
          languages: ${{ steps.activation.outputs.enabled == 'true' && 'go,typescript' || 'go' }}
