name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  smithy-verify:
    permissions:
      contents: read
    uses: ./.github/workflows/smithy-verify.yml

  test-go:
    name: Go Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go/go.mod'
          cache-dependency-path: 'go/go.sum'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v ./...

      - name: Check service layer drift
        run: ../scripts/check-service-drift.sh

  test-rust:
    name: Rust Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 # zizmor: ignore[cache-poisoning] -- cache is branch-isolated; fork PRs cannot write to this cache
        with:
          workspaces: |
            rust
            conformance/runner/rust

      - name: Format, lint and test
        run: make rs-check

      - name: Check generated code is up to date
        run: make rs-check-drift

  lint-go:
    name: Go Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go/go.mod'
          cache-dependency-path: 'go/go.sum'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: go
          version: latest
          args: --config .golangci.yml

  lint-actions:
    name: GitHub Actions audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false

  conformance:
    name: Conformance Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [test-go]
    defaults:
      run:
        working-directory: conformance/runner/go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'conformance/runner/go/go.mod'
          cache-dependency-path: 'conformance/runner/go/go.sum'

      - name: Run conformance tests
        run: go run .

  conformance-rust:
    name: Conformance Tests (Rust)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [test-rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 # zizmor: ignore[cache-poisoning] -- cache is branch-isolated; fork PRs cannot write to this cache
        with:
          workspaces: |
            rust
            conformance/runner/rust

      - name: Run conformance tests
        run: make conformance-rs

  spec-drift:
    name: Spec Drift
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Everything here is derived from openapi.json with bash + jq: url-routes.json,
      # route-coverage.json, the shape fingerprint, and the forward/reverse drift
      # checks against the haystack route snapshot. These are what stop the SDK
      # modelling routes HEY does not serve. (behavior-model-check needs the Smithy
      # AST, so it lives in the smithy-verify workflow.)
      - name: Check generated artifacts and route drift
        run: make url-routes-check drift-check-mvp

  api-compat:
    name: API Compatibility
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'breaking')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go/go.mod'
          cache-dependency-path: 'go/go.sum'

      - name: Install apidiff
        run: go install golang.org/x/exp/cmd/apidiff@v0.0.0-20250305212735-054e65f0b394

      - name: Check API compatibility
        # Compares go/pkg/hey — the sole exported package (internal/ is not public API).
        # Each apidiff invocation runs inside its respective module directory so
        # go list can resolve the package.
        run: |
          echo "Checking Go SDK API compatibility..."
          (cd base/go && apidiff -w /tmp/base.api ./pkg/hey)
          CHANGES=$(cd go && apidiff -incompatible /tmp/base.api ./pkg/hey 2>/tmp/apidiff.stderr) || status=$?
          status=${status:-0}
          if [ "$status" -ne 0 ]; then
            echo "::error::apidiff execution failed (exit $status)"
            cat /tmp/apidiff.stderr
            exit "$status"
          fi
          rm -f /tmp/apidiff.stderr

          # A release bumps Version, APIVersion moves when the spec is rebuilt against a
          # newer HEY, and DefaultUserAgent is built from both. apidiff counts a
          # constant's new value as an incompatible change, which for these three is the
          # point of the release rather than a break -- and it is why version.go went
          # unbumped from v0.1.1 through v0.3.0.
          CHANGES=$(printf '%s\n' "$CHANGES" | grep -Ev '^- (Version|APIVersion|DefaultUserAgent): value changed' || true)

          # Deliberate breaks ride in .github/apidiff-accepted as the exact lines
          # apidiff prints, matched whole (-Fx). Each entry is self-expiring: it
          # names the old signature, so once merged it can never mask a later
          # accidental change, which apidiff reports from the new baseline.
          if [ -f .github/apidiff-accepted ]; then
            CHANGES=$(printf '%s\n' "$CHANGES" | grep -Fxvf .github/apidiff-accepted || true)
          fi
          CHANGES=$(printf '%s' "$CHANGES" | sed '/^$/d')

          if [ -n "$CHANGES" ]; then
            echo "::error::Incompatible API changes detected"
            echo "$CHANGES"
            exit 1
          else
            echo "No breaking API changes detected"
          fi

  rubric-check:
    name: Rubric Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check critical rubric criteria
        run: |
          pass=0; total=4
          check() { if eval "$2"; then echo "PASS $1"; pass=$((pass+1)); else echo "FAIL $1: $3"; fi; }

          check "1A.1 Smithy spec" \
            '[ -d spec ] && [ -f spec/smithy-build.json ]' \
            "spec/ or smithy-build.json missing"
          check "1A.2 OpenAPI from Smithy" \
            '[ -f openapi.json ] && grep -q "Smithy" spec/smithy-build.json' \
            "openapi.json missing or not Smithy-generated"
          check "2A.1 Structured errors" \
            'grep -rq "ErrorCode\|error_code\|errorCode" --include="*.go" .' \
            "No structured error type found"
          check "4A.1 Smithy freshness" \
            'grep -q "smithy-check" Makefile' \
            "No smithy-check target in Makefile"

          echo "Critical: $pass/$total"
          [ "$pass" -eq "$total" ]
