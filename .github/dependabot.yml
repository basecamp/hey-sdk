version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /go
      - /conformance/runner/go
    groups:
      go:
        patterns:
          - "*"
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2
      default-days: 7
  - package-ecosystem: cargo
    directory: /rust
    groups:
      cargo:
        patterns:
          - "*"
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2
      default-days: 7
  - package-ecosystem: cargo
    directory: /conformance/runner/rust
    groups:
      cargo:
        patterns:
          - "*"
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2
      default-days: 7
  - package-ecosystem: npm
    directory: /typescript
    schedule:
      interval: weekly
    groups:
      typescript-dev:
        dependency-type: development
    ignore:
      # openapi-typescript 7.x peers on typescript ^5.x, so a TypeScript major
      # fails npm ci with ERESOLVE. Revisit when upstream supports it
      # (openapi-ts/openapi-typescript#2841).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7
  - package-ecosystem: gradle
    directory: /kotlin
    groups:
      gradle:
        patterns:
          - "*"
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2
      default-days: 7
  - package-ecosystem: github-actions
    directory: "/"
    groups:
      github-actions:
        patterns:
          - "*"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
