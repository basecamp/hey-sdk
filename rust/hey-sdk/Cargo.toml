[package]
name = "hey-sdk"
version = "0.30.0"
description = "Rust client for the HEY API, generated from the Smithy model in spec/"
readme = "README.md"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "hey_sdk"
path = "src/lib.rs"

[features]
default = ["reqwest"]
# The HTTP client the SDK ships. Off, an application supplies its own `http::HttpClient`.
reqwest = ["dep:reqwest"]

[dependencies]
async-trait = "0.1"
base64 = "0.23"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
# Active Storage checks an upload's integrity with a base64-encoded MD5, so the SDK has to
# speak MD5 whatever anyone thinks of it as a hash.
md5 = "0.8"
percent-encoding = "2"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"], optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
thiserror = "2"
# `rt` for the blocking pool the response cache's file reads go to; reqwest used to bring it
# along, and without the feature nothing else does.
tokio = { version = "1", features = ["io-util", "rt", "time", "sync"] }
tracing = "0.1"
url = "2"

[dev-dependencies]
# One test configures the shipped client through reqwest's own builder. Default features
# are off so this resolves to the same build as the dependency above rather than a second
# one.
reqwest = { version = "0.13", default-features = false }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time", "sync"] }
wiremock = "0.6"
