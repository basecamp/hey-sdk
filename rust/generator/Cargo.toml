[package]
name = "hey-sdk-generator"
version = "0.0.0"
description = "Generates the Rust HEY SDK's types, operations and route table from openapi.json"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "hey-sdk-generator"
path = "src/main.rs"

[dependencies]
heck = "0.5"
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
toml = "1.1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = "allow"
cargo = "allow"
# pedantic allowlist — each entry needs a one-line reason
module_name_repetitions = "allow"   # services::ProjectsService is the intended shape
must_use_candidate = "allow"        # builders return Self; noise
missing_errors_doc = "allow"        # every op returns Result<_, Error>; the error type is documented once
missing_panics_doc = "allow"        # no public fn panics; enforced by review, not doc lines
