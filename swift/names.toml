# Naming overrides for the Swift generator, the twin of kotlin/generator/names.toml.
#
# Services come from OpenAPI tags, snake_cased, with a leading "Calendar " dropped where the
# tag would otherwise repeat what the calendar module already says. A service's class is its
# PascalCase name with a `Service` suffix (`boxes` -> `BoxesService`) and its accessor on the
# client is the camelCase name (`client.timeTracks`). Method names come from the operationId
# with the service's own noun removed (ListBoxes -> boxes.list()), camelCased. The generator
# fails when two operations in one service end up with the same method name, or when a name
# is a Swift keyword, and this file is where those are settled.

[services]
"Bulk Reply" = "bulk_replies"
"Calendar Habits" = "habits"
"Calendar Journal" = "journal"
"Calendar Time Tracks" = "time_tracks"

# Operations that belong to a different service than their tag says. Every SDK files an
# operation under the same service, so these follow Go's own placement.
[operation_services]
BulkUpdateClearances = "clearances"
CreateBoxDesignation = "designations"
DeleteBoxDesignation = "designations"
GetBoxPostingChanges = "postings"
GetClearances = "clearances"
GetMyClearances = "clearances"
PuntClearances = "clearances"
UpdateClearance = "clearances"
UpdateMyClearance = "clearances"

# Schemas whose Smithy name collides with something Swift or Foundation already has. The rename
# reaches every place the generator writes the type and nowhere else: a type name never goes on
# the wire. A type in an imported module shadows the standard library's, so a model called
# Collection would take the protocol's place in every file that imports the package, and one
# called Calendar Foundation's.
[type_names]
Calendar = "HeyCalendar"
Collection = "HeyCollection"

# Method names the derivation would get wrong: a collision within a service, or a name
# that reads badly on its own. These follow the Rust and Kotlin generators' settlements so every
# SDK names one operation the same way.
[operation_methods]
CreateBoxDesignation = "create"
CreateFolderForPostings = "createFolder"
DeleteBoxDesignation = "delete"
GetTopicPublication = "get"
MovePostings = "movePostings"
MoveSticky = "moveSticky"
MoveTopic = "moveTopic"
MoveWorkflowStaging = "moveStaging"
NewBulkReply = "newBulkReply"

# The noun each service's operations act on, as the hooks report it. Nothing in OpenAPI
# says it, and every HEY SDK has to name it the same way, so it is written down here. The
# generator fails when a service has no entry.
[resource_types]
attachments = "attachment"
boxes = "box"
bulk_replies = "bulk_reply"
calendar_events = "calendar_event"
calendar_periods = "calendar_period"
calendar_todos = "calendar_todo"
calendars = "calendar"
clearances = "clearance"
clips = "clip"
collections = "collection"
contacts = "contact"
designations = "designation"
entries = "entry"
extenzions = "extenzion"
folders = "folder"
habits = "habit"
identity = "identity"
journal = "journal_entry"
messages = "message"
postings = "posting"
publications = "publication"
search = "search"
snippets = "snippet"
stickies = "sticky"
time_tracks = "time_track"
topics = "topic"
workflows = "workflow"

# Operations that act on something other than their service's noun.
[operation_resource_types]
CreateBoxGroup = "box_group"
GetWorkflowStage = "workflow_stage"
CreateReply = "reply"
CreateTimeTrackCategory = "category"
CreateTopicCollecting = "collecting"
CreateWorkflowStage = "workflow_stage"
CreateWorkflowStaging = "workflow_staging"
DeleteBoxGroup = "box_group"
DeleteContactNote = "note"
DeleteDraft = "draft"
DeleteTimeTrackCategory = "category"
DeleteTopicCollecting = "collecting"
DeleteWorkflowStage = "workflow_stage"
DeleteWorkflowStaging = "workflow_staging"
GetBoxGroup = "box_group"
GetBoxPostingChanges = "posting"
GetCalendarDay = "calendar_day"
GetCalendarRecordingChanges = "recording"
GetCalendarRecordings = "recording"
GetCalendarWeek = "calendar_week"
GetCalendarYear = "calendar_year"
GetContactNote = "note"
GetMessageEdit = "draft"
GetNavigation = "navigation"
GetTopicEntries = "entry"
ListBoxGroups = "box_group"
ListCalendarDays = "calendar_day"
ListCalendarWeeks = "calendar_week"
ListDrafts = "draft"
ListTimeTrackCategories = "category"
MoveWorkflowStaging = "workflow_staging"
UpdateContactNote = "note"
UpdateMyClearance = "clearance"
UpdateTimeTrackCategory = "category"
UpdateWorkflowStage = "workflow_stage"
